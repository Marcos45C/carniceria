name: carniceria-pro

# Supabase local NO está acá: lo gestiona la CLI oficial (pnpm db:start).
# El navegador se conecta directo a Supabase (http://127.0.0.1:54321), por lo
# que el contenedor no necesita acceso a él.

services:
  # Desarrollo: pnpm docker:dev  ->  http://localhost:5173
  web:
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
    volumes:
      # El código se monta desde tu carpeta (Vite también lee ahí tu .env.local).
      - .:/app
      # Los node_modules quedan dentro de Docker, separados de los de tu PC.
      - node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"

  # Pruebas del frontend: pnpm docker:test
  test:
    profiles: ["test"]
    build:
      context: .
      target: test

  # Build de producción servido con nginx: pnpm docker:preview -> http://localhost:8080
  preview:
    profiles: ["preview"]
    build:
      context: .
      target: preview
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
    ports:
      - "8080:80"

volumes:
  node_modules: