server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Fallback de React Router: cualquier ruta devuelve index.html
  location / {
    try_files $uri /index.html;
  }

  # Los archivos con hash en el nombre se pueden cachear para siempre
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
}